name: deploy

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    secrets:
      CHROME_CLIENT_ID:
        required: true
      CHROME_CLIENT_SECRET:
        required: true
      CHROME_REFRESH_TOKEN:
        required: true
      FIREFOX_JWT_ISSUER:
        required: true
      FIREFOX_JWT_SECRET:
        required: true

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@cd2651c46231bc0d6f48d6b34433b845331235fe # v5.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension
          path: .output
      - name: Configure detailed submission errors
        run: printf '%s\n' "require('node:util').inspect.defaultOptions.depth = null;" > /tmp/inspect-depth.cjs
      - name: Submit to Chrome Web Store
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          NODE_OPTIONS: --require=/tmp/inspect-depth.cjs
          CHROME_EXTENSION_ID: ekeehglopcojnbieeopijckckabkpbfj
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      - name: Submit to Firefox Add-ons

        run: npx wxt submit --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          NODE_OPTIONS: --require=/tmp/inspect-depth.cjs
          FIREFOX_EXTENSION_ID: jsc@dy0gu.com
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
